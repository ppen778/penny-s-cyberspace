<script>
  const THEMES = GALLERY_RED;
  const ORIG = {
    kaidu: n => '../营销图文/凯度B8全测评图片（全产品介绍版）/稿定设计-' + n + '.jpg',
    catfood: n => '../营销图文/宠物猫粮测评表格小红书配图/稿定设计-' + n + '.jpg',
    watch: n => '../营销图文/抗糖手表/' + n + '.png',
    banwei: n => '../营销图文/班味营销/稿定设计-' + n + '.jpg',
    tea: n => { const f = ['微信图片_20251211011352_190_55.jpg', '微信图片_20251211011353_191_55.jpg']; return '../营销图文/茶饮健康赛道营销/' + f[n - 1]; }
  };

  const listEl = document.getElementById('themeList');
  Object.keys(THEMES).filter(key => key !== 'catfood').forEach(key => {
    const t = THEMES[key];
    const card = document.createElement('div');
    card.className = 'theme-card';
    card.innerHTML = '<div class="tcover"><img src="assets/red/' + key + '/01.jpg" alt="' + t.name + '"></div>' +
      '<div class="tname">' + t.name + '<small>' + t.items.length + ' 张图文</small></div>';
    card.addEventListener('click', () => showTheme(key));
    listEl.appendChild(card);
  });

  let galleryApp = null;
  function showTheme(key) {
    const t = THEMES[key];
    document.getElementById('themeTitle').textContent = t.name;
    document.getElementById('themeList').style.display = 'none';
    document.getElementById('themeView').style.display = 'block';
    if (galleryApp) { galleryApp.destroy(); galleryApp = null; }
    const grid = document.getElementById('themeGrid');
    grid.innerHTML = '';
    t.items.forEach((it, i) => {
      const a = document.createElement('a');
      a.className = 'red-frame';
      a.href = ORIG[key](i + 1);
      a.target = '_blank';
      a.innerHTML = '<div class="art"><img src="assets/red/' + key + '/' + String(i + 1).padStart(2, '0') + '.jpg" alt="' + t.name + ' ' + (i + 1) + '"></div>' +
        '<div class="cap">' + it.text + '</div>';
      grid.appendChild(a);
    });
    galleryApp = initCircularGallery(document.getElementById('gallery'), t.items);
  }

  document.getElementById('backTheme').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('themeView').style.display = 'none';
    document.getElementById('themeList').style.display = '';
    if (galleryApp) { galleryApp.destroy(); galleryApp = null; }
  });
</script>

<script src="assets/edit.js"></script>
