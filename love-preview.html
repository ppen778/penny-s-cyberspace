<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「我爱你」放置方案预览</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F7F3EA;font-family:"Microsoft YaHei",sans-serif;padding:36px 28px}
  h1{font-size:24px;font-weight:800;margin-bottom:6px}
  .sub{font-size:13px;color:#6B6353;margin-bottom:26px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .panel{
    position:relative;height:480px;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,#FFFFFF,#F2F6FD);
    background-image:radial-gradient(rgba(140,175,210,.25) 1.2px, transparent 1.2px);
    background-size:20px 20px;
    border:2px solid #1C1B18;
    box-shadow:6px 6px 0 rgba(28,27,24,.85);
  }
  .panel .win{
    position:absolute;width:120px;height:90px;border-radius:10px;
    background:rgba(255,255,255,.9);border:1px solid rgba(17,17,17,.15);
    box-shadow:0 10px 24px rgba(30,60,110,.15);
  }
  .panel .w1{right:10px;top:12px}
  .panel .w2{right:10px;top:118px}
  .label{
    position:absolute;left:12px;top:12px;z-index:5;
    font-size:12px;font-weight:800;background:#FFD34D;
    border:1.5px solid #1C1B18;border-radius:8px;padding:4px 10px;
  }
  .desc{
    margin-top:10px;font-size:12.5px;color:#5A5548;line-height:1.8;
    background:#fff;border:1px solid rgba(28,27,24,.18);
    border-radius:10px;padding:10px 12px;
  }
  .love{position:absolute;filter:drop-shadow(0 10px 18px rgba(30,60,110,.25))}
  .love img{width:110px;height:110px;object-fit:contain;display:block}
  .optA .love{left:16px;bottom:20px;transform:rotate(-5deg);animation:bob 4s ease-in-out infinite}
  .optB .love{left:50%;margin-left:-55px;top:70px;transform:rotate(2deg);animation:bob 4.5s .4s ease-in-out infinite}
  .optC .love{left:50%;margin-left:-55px;bottom:14px;transform:rotate(-2deg)}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(-5deg)}}
  .optB .love{animation-name:bobB}
  @keyframes bobB{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
</style>
</head>
<body>
  <h1>「我爱你」放置方案 ✦ 选一个</h1>
  <div class="sub">三种拼贴摆放，看看更喜欢哪种，回复 A / B / C 即可。</div>
  <div class="row">
    <div>
      <div class="panel optA">
        <span class="label">方案 A</span>
        <span class="win w1"></span>
        <span class="win w2"></span>
        <span class="love"><img src="assets/deco/love.png" alt="我爱你"></span>
      </div>
      <div class="desc"><b>A · 左下角贴纸</b><br>放在桌面的左下角，像随手贴的贴纸，微微旋转、轻轻浮动，和"你好呀"气泡呼应。</div>
    </div>
    <div>
      <div class="panel optB">
        <span class="label">方案 B</span>
        <span class="win w1"></span>
        <span class="win w2"></span>
        <span class="love"><img src="assets/deco/love.png" alt="我爱你"></span>
      </div>
      <div class="desc"><b>B · 挂在路灯下</b><br>放在路灯正下方，像灯光下的一句话，和路灯形成一组"吊灯告白"。</div>
    </div>
    <div>
      <div class="panel optC">
        <span class="label">方案 C</span>
        <span class="win w1"></span>
        <span class="win w2"></span>
        <span class="love"><img src="assets/deco/love.png" alt="我爱你"></span>
      </div>
      <div class="desc"><b>C · 底部中间便签</b><br>放在桌面底部正中间，像一张手写便签，安静地待在页面下方。</div>
    </div>
  </div>
<script src="assets/sparks.js"></script>
<script src="assets/pillnav.js"></script>
</body>
</html>
