<script>
  const VIDEOS = [
    { name: '曼谷 vlog', tag: 'Douyin · 已下载', src: 'assets/video/bangkok.mp4', external: false },
    { name: '和朋友们的聚会团建 vlog', tag: 'Douyin · 站外', src: 'https://v.douyin.com/sOuOlL9O77o/', external: true },
    { name: '和朋友们的聚会 2', tag: 'Douyin · 已下载', src: 'assets/video/party2.mp4', external: false },
    { name: '抖音剪辑', tag: '本地素材', src: '../视频/seetigh抖音剪辑.mp4', external: false },
    { name: '时光的河入海流', tag: '本地素材', src: '../视频/时光的河入海流.mp4', external: false },
    { name: '视频 03', tag: '本地素材', src: '../视频/c08a9ec293f3f130a4a111f508b43ea6.mp4', external: false },
    { name: '鼠的月记 1', tag: '微信视频号 · 站外', src: 'https://weixin.qq.com/sph/ASQYPqnbo3', external: true },
    { name: '日常 vlog 碎片', tag: '微信视频号 · 站外', src: 'https://weixin.qq.com/sph/AdPYekuvyj', external: true }
  ];

  const grid = document.getElementById('videoGrid');
  const player = document.getElementById('vidPlayer');

  VIDEOS.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'vid-card' + (v.external ? ' external' : '');
    card.innerHTML = '<div class="cam">' + (v.external ? '🔗' : '🎥') + '</div>' +
      '<h3>' + v.name + '</h3><div class="vtag">' + v.tag + '</div>';
    card.addEventListener('click', () => {
      if (v.external) {
        window.open(v.src, '_blank');
        return;
      }
      player.innerHTML = '<video controls autoplay preload="metadata" src="' + v.src + '"></video>';
      player.classList.add('show');
      player.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    grid.appendChild(card);
  });
</script>
