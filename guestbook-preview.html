<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访客留言板 ✦ 投递信箱交互预览</title>
<style>
  @font-face{font-family:'ZKuaile';src:url('assets/fonts/zcool-kuaile.ttf') format('truetype');}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#FDEFF4,#F3F0FB);
    font-family:"Microsoft YaHei",sans-serif;
    padding:32px 34px 60px;color:#1C1B18;
  }
  h1{font-family:'ZKuaile';font-size:26px;font-weight:400;letter-spacing:.02em;margin-bottom:6px}
  .sub{font-size:13px;color:#6B6353;margin-bottom:18px;line-height:1.9;max-width:980px}
  .sub b{color:#C24D7E}
  .stage{
    position:relative;height:340px;border-radius:18px;overflow:hidden;
    background:
      radial-gradient(circle 5px at 60px 60px, rgba(147,171,217,.35) 4px, transparent 5px),
      radial-gradient(circle 4px at 140px 180px, rgba(231,142,248,.3) 3px, transparent 4px),
      linear-gradient(180deg,#FDEFF4 0%,#F3F0FB 60%,#F1F0FB 100%);
    border:2px solid rgba(28,27,24,.75);box-shadow:5px 5px 0 rgba(28,27,24,.8);
    display:flex;align-items:center;justify-content:center;
  }
  .mailbox{position:relative;cursor:pointer;transition:transform .25s}
  .mailbox:hover{transform:translateY(-6px) rotate(-1.5deg)}
  .mailbox svg{display:block;width:230px;height:auto;filter:drop-shadow(0 14px 24px rgba(60,40,90,.25))}
  .mailbox .hint{
    position:absolute;top:-34px;left:50%;transform:translateX(-50%);
    font-family:'ZKuaile';font-size:14px;color:#C24D7E;white-space:nowrap;
    background:#fff;border:1.5px solid rgba(28,27,24,.3);border-radius:8px;padding:4px 12px;
    box-shadow:2px 2px 0 rgba(28,27,24,.5);
  }
  .mailbox .hint::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}
  .mailbox.ring .flag{animation:flagup .5s ease}
  @keyframes flagup{0%{transform:rotate(0)}50%{transform:rotate(30deg)}100%{transform:rotate(0)}}
  .star{position:absolute;color:#F2619C;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
  .star.s2{color:#E78EF8;animation-delay:.7s}
  .star.s3{color:#EDE986;animation-delay:1.3s}
  @keyframes tw{0%,100%{transform:scale(.8) rotate(-8deg);opacity:.5}50%{transform:scale(1.2) rotate(10deg);opacity:1}}

  /* 窗口 */
  .win{
    position:fixed;inset:0;background:rgba(40,30,60,.35);display:none;align-items:center;justify-content:center;z-index:50;
    backdrop-filter:blur(3px);
  }
  .win.open{display:flex}
  .panel{
    width:460px;max-width:92vw;background:rgba(255,255,255,.97);border-radius:16px;
    border:2px solid rgba(28,27,24,.2);box-shadow:0 24px 60px rgba(30,40,80,.3);
    overflow:hidden;transform:translateY(14px);transition:transform .3s;
  }
  .win.open .panel{transform:none}
  .p-head{
    display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;
    border-bottom:1px solid rgba(17,17,17,.08);font-family:'ZKuaile';font-size:15px;
  }
  .p-head .x{margin-left:auto;width:22px;height:22px;border-radius:50%;border:none;background:#E9EEF4;color:#5A6B7C;cursor:pointer;font-size:11px}
  .p-head .x:hover{background:#F2619C;color:#fff}
  .p-body{padding:18px 20px 20px}
  .p-body label{display:block;font-size:12.5px;color:#6B6353;margin:10px 0 6px}
  .p-body input,.p-body textarea{
    width:100%;border:1.5px solid rgba(28,27,24,.25);border-radius:10px;padding:10px 12px;
    font-size:14px;font-family:inherit;background:#fff;outline:none;transition:border-color .2s, box-shadow .2s;
  }
  .p-body input:focus,.p-body textarea:focus{border-color:#F2619C;box-shadow:0 0 0 3px rgba(242,97,156,.18)}
  .p-body textarea{height:120px;resize:vertical;line-height:1.8}
  .send{
    width:100%;margin-top:16px;border:none;cursor:pointer;
    font-family:'ZKuaile';font-size:17px;letter-spacing:.06em;color:#fff;
    background:linear-gradient(90deg,#F2619C,#E78EF8);border-radius:999px;padding:12px;
    box-shadow:0 8px 20px rgba(242,97,156,.35);transition:transform .2s, box-shadow .2s;
  }
  .send:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(242,97,156,.45)}
  .send:active{transform:scale(.97)}

  /* 投递动画 */
  .fly-wrap{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
  .fly-wrap.on{display:block}
  .envelope{
    position:absolute;left:50%;top:44%;width:54px;height:40px;border-radius:6px;
    background:linear-gradient(135deg,#fff,#FCE1EE);
    border:2px solid #F2619C;box-shadow:0 8px 18px rgba(242,97,156,.4);
    transition:transform 1s cubic-bezier(.3,.7,.3,1), opacity .5s .5s;
    transform:translate(-50%,-50%) rotate(0deg) scale(1);
  }
  .fly-wrap.on .envelope{transform:translate(240px,190px) rotate(-18deg) scale(.5);opacity:0}
  .toast{
    position:fixed;left:50%;bottom:46px;transform:translate(-50%,20px);
    background:#1C1B18;color:#fff;font-family:'ZKuaile';font-size:15px;letter-spacing:.04em;
    padding:10px 22px;border-radius:999px;opacity:0;transition:all .4s .9s;z-index:70;pointer-events:none;
    box-shadow:0 10px 24px rgba(0,0,0,.3);white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* 留言板 */
  .board{margin-top:26px}
  .board h2{font-family:'ZKuaile';font-size:19px;font-weight:400;margin-bottom:4px}
  .board .bn{font-size:12px;color:#8A7A5C;margin-bottom:14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .card{
    position:relative;background:#fff;border:1.5px solid rgba(28,27,24,.16);border-radius:12px;
    padding:16px 16px 12px;box-shadow:0 8px 18px rgba(60,40,90,.1);
    transition:transform .25s, box-shadow .25s;
  }
  .card:nth-child(3n+1){transform:rotate(-1.2deg)}
  .card:nth-child(3n+2){transform:rotate(1deg)}
  .card:nth-child(3n){transform:rotate(-.5deg)}
  .card:hover{transform:rotate(0) translateY(-4px);box-shadow:0 14px 28px rgba(60,40,90,.18)}
  .card::before{
    content:"";position:absolute;left:50%;top:-7px;width:56px;height:16px;transform:translateX(-50%) rotate(-2deg);
    background:rgba(242,97,156,.28);border-left:2px dashed rgba(255,255,255,.85);border-right:2px dashed rgba(255,255,255,.85);
  }
  .card .who{font-family:'ZKuaile';font-size:14px;color:#C24D7E}
  .card .msg{font-size:13px;color:#2A2A2A;line-height:1.85;margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .card .time{font-size:10.5px;color:#A99A84;margin-top:10px}
  .card .stamp{
    position:absolute;right:10px;top:10px;font-size:9.5px;color:#7A6A3E;letter-spacing:.08em;
    border:1.5px solid rgba(237,233,134,.9);border-radius:6px;padding:2px 6px;background:#FBF6D9;transform:rotate(6deg);
  }
  .note{margin-top:18px;font-size:12px;color:#5A5548;background:#fff;border:1px solid rgba(28,27,24,.16);border-radius:10px;padding:9px 14px;line-height:1.9}
  .note b{color:#C24D7E}
</style>
</head>
<body>
  <h1>访客留言板 ✦ 投递信箱交互预览</h1>
  <div class="sub">点一下桌面上的<b>粉色小信箱</b>，写下昵称和想说的话，点「投递 ✦」——信纸会折起飞进信箱，火花一闪，叮咚一声送达。下面就是留言板的样子。</div>

  <div class="stage">
    <span class="star" style="left:12%;top:20%;font-size:20px">✦</span>
    <span class="star s2" style="left:78%;top:26%;font-size:14px">✦</span>
    <span class="star s3" style="left:86%;top:64%;font-size:18px">✦</span>
    <span class="star s2" style="left:8%;top:66%;font-size:12px">✦</span>
    <div class="mailbox" id="mailbox">
      <div class="hint">✦ 给盆盆寄一封信 ✦</div>
      <svg viewBox="0 0 220 170" aria-hidden="true">
        <path class="flag" d="M150 44 L196 36 L196 58 L150 56 Z" fill="#E78EF8" stroke="#1C1B18" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="150" y1="44" x2="150" y2="120" stroke="#1C1B18" stroke-width="3" stroke-linecap="round"/>
        <rect x="34" y="86" width="140" height="58" rx="14" fill="#F2619C" stroke="#1C1B18" stroke-width="2.5"/>
        <path d="M34 92 Q104 138 174 92 L174 86 L34 86 Z" fill="#E78EF8" stroke="#1C1B18" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="88" y="100" width="32" height="16" rx="8" fill="#fff" stroke="#1C1B18" stroke-width="2"/>
        <path d="M40 150 L166 150" stroke="#1C1B18" stroke-width="3" stroke-linecap="round"/>
        <path d="M118 158 L88 150 L118 142" fill="none" stroke="#1C1B18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="win" id="win">
    <div class="panel">
      <div class="p-head">✉ 给盆盆寄一封信<span class="x" id="closeWin">✕</span></div>
      <div class="p-body">
        <label>你的昵称</label>
        <input id="nick" maxlength="16" placeholder="比如：路过的星星">
        <label>想说的话</label>
        <textarea id="msg" maxlength="300" placeholder="写点什么吧～悄悄话也可以"></textarea>
        <button class="send" id="sendBtn">投递 ✦</button>
      </div>
    </div>
  </div>

  <div class="fly-wrap" id="flyWrap"><div class="envelope"></div></div>
  <div class="toast" id="toast">叮咚～ 你的信已经送达 ✦</div>

  <div class="board">
    <h2>留言板 ✦ Message Board</h2>
    <div class="bn">共 <span id="count">0</span> 封信 · 每条留言都会贴在这里</div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="note">当前是<b>本地演示</b>：留言只保存在这台电脑的这个浏览器里。等你选定后端方案（推荐 Twikoo / Waline 或 FormSubmit），我会把同一个信箱交互接上真实数据，让所有访客都能看到彼此的留言。</div>

  <script>
    (function () {
      const KEY = 'gb-demo-msgs';
      const seed = [
        { nick: '麻薯朋友', msg: '好喜欢这个网站的风格！粉粉嫩嫩又很有自己的想法～', time: '2026/8/5 21:40', me: true },
        { nick: '路过的小鹿', msg: '被桌面上的小信箱吸引进来的，祝你找到心仪的工作！', time: '2026/8/5 22:03', me: false }
      ];
      let msgs = [];
      try {
        const raw = localStorage.getItem(KEY);
        msgs = raw ? JSON.parse(raw) : null;
      } catch (e) {}
      if (!msgs || !msgs.length) msgs = seed.slice();

      const cards = document.getElementById('cards');
      const count = document.getElementById('count');
      const mailbox = document.getElementById('mailbox');
      const win = document.getElementById('win');
      const nick = document.getElementById('nick');
      const msg = document.getElementById('msg');

      function render() {
        cards.innerHTML = '';
        msgs.slice().reverse().forEach(m => {
          const el = document.createElement('div');
          el.className = 'card';
          el.innerHTML = '<span class="stamp">已送达</span><div class="who">' + m.nick + '</div><div class="msg"></div><div class="time">' + m.time + '</div>';
          el.querySelector('.msg').textContent = m.msg;
          cards.appendChild(el);
        });
        count.textContent = msgs.length;
      }
      function save() { try { localStorage.setItem(KEY, JSON.stringify(msgs)); } catch (e) {} }

      mailbox.addEventListener('click', () => win.classList.add('open'));
      document.getElementById('closeWin').addEventListener('click', () => win.classList.remove('open'));
      win.addEventListener('click', e => { if (e.target === win) win.classList.remove('open'); });

      document.getElementById('sendBtn').addEventListener('click', () => {
        const n = nick.value.trim(), m = msg.value.trim();
        if (!n) { nick.focus(); nick.style.borderColor = '#FF2D55'; return; }
        if (!m) { msg.focus(); msg.style.borderColor = '#FF2D55'; return; }
        nick.style.borderColor = ''; msg.style.borderColor = '';
        win.classList.remove('open');
        mailbox.classList.add('ring');
        const fly = document.getElementById('flyWrap');
        const toast = document.getElementById('toast');
        fly.classList.add('on');
        setTimeout(() => toast.classList.add('show'), 500);
        setTimeout(() => {
          fly.classList.remove('on');
          toast.classList.remove('show');
          mailbox.classList.remove('ring');
        }, 2200);
        const now = new Date();
        msgs.push({
          nick: n,
          msg: m,
          time: now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
          me: true
        });
        save();
        render();
        nick.value = ''; msg.value = '';
      });

      render();
    })();
  </script>
</body>
</html>
